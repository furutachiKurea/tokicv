name: TokiCV delivery

on:
  push:
    branches: [factory/tokicv-delivery]
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number, or 0 to test the model and package the current commit
        type: number
        default: 0

permissions: {}

concurrency:
  group: tokicv-delivery-${{ github.event.issue.number || inputs.issue || 'smoke' }}
  cancel-in-progress: false

env:
  ISSUE: ${{ github.event.issue.number || inputs.issue || 0 }}
  BASE: ${{ github.sha }}
  MODEL: deepseek-v4.1-flash
  EFFORT: max
  RESPONSES_URL: https://opencode.ai/inference/go/openai/v1/responses

jobs:
  implement:
    if: >-
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      (github.event_name != 'issue_comment' ||
       (!github.event.issue.pull_request && startsWith(github.event.comment.body, '/tokicv'))) &&
      (github.event_name != 'workflow_dispatch' || github.ref_type == 'branch')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
    outputs:
      status: ${{ steps.result.outputs.status }}
      candidate: ${{ steps.result.outputs.candidate }}
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Read the owner's issue and decisions
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/github-delivery.py prompt "$RUNNER_TEMP"
      - name: Require the DeepSeek credential
        if: steps.issue.outputs.exists != 'true'
        env:
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
        run: |
          if [[ -z "$OPENCODE_GO_API_KEY" ]]; then
            echo "::error::Missing GitHub Actions secret OPENCODE_GO_API_KEY"
            exit 1
          fi
      - uses: actions/setup-go@v6
        if: env.ISSUE != '0' && steps.issue.outputs.exists != 'true'
        with:
          go-version-file: go.mod
      - name: Implement or check model access
        if: steps.issue.outputs.exists != 'true'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENCODE_GO_API_KEY }}
          responses-api-endpoint: ${{ env.RESPONSES_URL }}
          model: ${{ env.MODEL }}
          effort: ${{ env.EFFORT }}
          codex-version: 0.171.0
          sandbox: ${{ env.ISSUE == '0' && 'read-only' || 'workspace-write' }}
          prompt-file: ${{ runner.temp }}/implement.md
          output-file: ${{ runner.temp }}/implementation.json
          output-schema: '{"type":"object","properties":{"status":{"type":"string","enum":["ready","needs_decision","needs_design","complete"]},"message":{"type":"string"}},"required":["status","message"],"additionalProperties":false}'
      - name: Record the candidate
        id: result
        run: |
          git show "$BASE:scripts/github-delivery.py" >"$RUNNER_TEMP/delivery.py"
          python3 "$RUNNER_TEMP/delivery.py" candidate "$RUNNER_TEMP"
      - uses: actions/upload-artifact@v7
        id: upload
        with:
          name: candidate-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error
          retention-days: 7

  review:
    needs: implement
    if: needs.implement.outputs.status == 'ready'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      status: ${{ steps.result.outputs.status }}
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.implement.outputs.artifact }}
          path: ${{ runner.temp }}/candidate
      - name: Prepare the independent review
        run: |
          git fetch "$RUNNER_TEMP/candidate/change.bundle" refs/heads/tokicv-candidate
          test "$(git rev-parse FETCH_HEAD)" = "$CANDIDATE"
          {
            printf '审查 TokiCV 提交 %s 相对于 %s 的差异。核对 AGENTS.md、需求和验收条件。\n' "$CANDIDATE" "$BASE"
            printf '只报告具体阻塞项。通过返回 pass，有阻塞返回 blocked。请勿编辑文件。\n\n'
            cat "$RUNNER_TEMP/candidate/issue.json"
          } >"$RUNNER_TEMP/review.md"
        env:
          CANDIDATE: ${{ needs.implement.outputs.candidate }}
      - name: Review with DeepSeek
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENCODE_GO_API_KEY }}
          responses-api-endpoint: ${{ env.RESPONSES_URL }}
          model: ${{ env.MODEL }}
          effort: ${{ env.EFFORT }}
          codex-version: 0.171.0
          sandbox: read-only
          prompt-file: ${{ runner.temp }}/review.md
          output-file: ${{ runner.temp }}/review.json
          output-schema: '{"type":"object","properties":{"status":{"type":"string","enum":["pass","blocked"]},"message":{"type":"string"}},"required":["status","message"],"additionalProperties":false}'
      - name: Record review status
        id: result
        run: python3 scripts/github-delivery.py review "$RUNNER_TEMP"
      - uses: actions/upload-artifact@v7
        id: upload
        with:
          name: review-${{ github.run_attempt }}
          path: ${{ runner.temp }}/review.json
          retention-days: 7

  package:
    needs: [implement, review]
    if: >-
      always() && !cancelled() && needs.implement.result == 'success' &&
      (needs.implement.outputs.status == 'smoke' ||
       (needs.review.result == 'success' && needs.review.outputs.status == 'pass'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        if: needs.implement.outputs.status == 'ready'
        with:
          artifact-ids: ${{ needs.implement.outputs.artifact }}
          path: ${{ runner.temp }}/candidate
      - name: Check out the reviewed commit
        if: needs.implement.outputs.status == 'ready'
        env:
          CANDIDATE: ${{ needs.implement.outputs.candidate }}
        run: |
          git fetch "$RUNNER_TEMP/candidate/change.bundle" refs/heads/tokicv-candidate
          test "$(git rev-parse FETCH_HEAD)" = "$CANDIDATE"
          git switch --detach "$CANDIDATE"
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install Linux verification and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dbus-daemon fonts-noto-cjk libgtk-3-0t64 libwebkit2gtk-4.1-dev \
            locales mutter rpm xsel xwayland
          sudo locale-gen zh_CN.UTF-8 en_US.UTF-8
          echo /usr/lib/x86_64-linux-gnu/webkit2gtk-4.1 >>"$GITHUB_PATH"
      - name: Verify and package
        run: scripts/deliver.sh "$RUNNER_TEMP/delivery"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tokicv-linux-amd64-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/delivery/*/commit.txt
            ${{ runner.temp }}/delivery/*/version.txt
            ${{ runner.temp }}/delivery/*/build.log
            ${{ runner.temp }}/delivery/*/verification/*.log
            ${{ runner.temp }}/delivery/*/verification/report.md
            ${{ runner.temp }}/delivery/*/packages/linux-amd64/*.deb
            ${{ runner.temp }}/delivery/*/packages/linux-amd64/*.rpm
            ${{ runner.temp }}/delivery/*/packages/linux-amd64/*.tar.gz
            ${{ runner.temp }}/delivery/*/packages/linux-amd64/install.sh
            ${{ runner.temp }}/delivery/*/packages/linux-amd64/PKGBUILD
          if-no-files-found: warn
          retention-days: 14

  report:
    needs: [implement, review, package]
    if: >-
      always() && !cancelled() && needs.implement.result != 'skipped' &&
      (github.event.issue.number != null || inputs.issue > 0) &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        if: needs.implement.result == 'success'
        with:
          artifact-ids: ${{ needs.implement.outputs.artifact }}
          path: ${{ runner.temp }}/candidate
      - uses: actions/download-artifact@v8
        if: needs.review.result == 'success'
        with:
          artifact-ids: ${{ needs.review.outputs.artifact }}
          path: ${{ runner.temp }}
      - name: Report the result and open the draft PR
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ needs.implement.outputs.status }}
          REVIEW_RESULT: ${{ needs.review.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          CANDIDATE: ${{ needs.implement.outputs.candidate }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 scripts/github-delivery.py report "$RUNNER_TEMP"
