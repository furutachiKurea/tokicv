name: TokiCV delivery
run-name: >-
  ${{ github.event.issue.pull_request &&
      format('TokiCV PR #{0}', github.event.issue.number) ||
      ((github.event.issue.number || inputs.issue) &&
       format('TokiCV issue #{0}', github.event.issue.number || inputs.issue)) ||
      'TokiCV smoke' }}

on:
  push:
    branches: [factory/tokicv-delivery]
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number, or 0 to test the model and package the current commit
        type: number
        default: 0

permissions: {}

jobs:
  intake:
    if: >-
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      (github.event_name != 'issue_comment' ||
       startsWith(github.event.comment.body, '/tokicv')) &&
      (github.event_name != 'workflow_dispatch' || github.ref_type == 'branch')
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
    outputs:
      issue: ${{ steps.target.outputs.issue }}
      target_kind: ${{ steps.target.outputs.target_kind }}
      target_number: ${{ steps.target.outputs.target_number }}
      comment_id: ${{ steps.target.outputs.comment_id }}
      skip: ${{ steps.target.outputs.skip }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Resolve the canonical issue
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 scripts/github-delivery.py intake "$RUNNER_TEMP"

  delivery:
    needs: intake
    if: needs.intake.outputs.skip != 'true'
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: read
    uses: ./.github/workflows/delivery-run.yml
    with:
      issue: ${{ fromJSON(needs.intake.outputs.issue) }}
      target_kind: ${{ needs.intake.outputs.target_kind }}
      target_number: ${{ fromJSON(needs.intake.outputs.target_number) }}
      comment_id: ${{ needs.intake.outputs.comment_id }}
      event_name: ${{ github.event_name }}
    secrets:
      OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
